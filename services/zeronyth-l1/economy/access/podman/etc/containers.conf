[engine]
helper_binaries_dir = ["/workspace/podman/podman-linux-amd64/usr/local/lib/podman", "/workspace/podman/podman-linux-amd64/usr/local/libexec/podman", "/workspace/podman/podman-linux-amd64/usr/local/bin"]
conmon_path = ["/workspace/podman/podman-linux-amd64/usr/local/lib/podman/conmon"]
runtime = "crun"
cgroup_manager = "cgroupfs"
events_logger = "file"
[engine.runtimes]
crun = ["/workspace/podman/podman-linux-amd64/usr/local/bin/crun"]
[containers]
cgroups = "disabled"
netns = "pasta"
log_driver = "k8s-file"
[network]
default_rootless_network_cmd = "pasta"
