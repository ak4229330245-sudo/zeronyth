name: zeronyth-l1

x-besu-image: &besu-image hyperledger/besu:26.9.0
x-besu-common: &besu-common
  image: *besu-image
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
      quantum:
        ipv4_address: 172.28.0.11
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./config:/config:ro

services:
  node1:
    <<: *besu-common
    command:
      - --profile=ENTERPRISE
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=9127
      - --sync-mode=FULL
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/data/static-nodes.json
      - --nat-method=NONE
      - --sync-min-peers=1
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=localhost,127.0.0.1,node1,explorer
      - --rpc-http-cors-origins=all
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./node-data/node1:/data
    ports:
      - "127.0.0.1:8545:8545"

  node2:
    networks:
      quantum:
        ipv4_address: 172.28.0.12
    <<: *besu-common
    command:
      - --profile=ENTERPRISE
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=9127
      - --sync-mode=FULL
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/data/static-nodes.json
      - --nat-method=NONE
      - --sync-min-peers=1
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./node-data/node2:/data

  node3:
    networks:
      quantum:
        ipv4_address: 172.28.0.13
    <<: *besu-common
    command:
      - --profile=ENTERPRISE
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=9127
      - --sync-mode=FULL
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/data/static-nodes.json
      - --nat-method=NONE
      - --sync-min-peers=1
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./node-data/node3:/data

  node4:
    networks:
      quantum:
        ipv4_address: 172.28.0.14
    <<: *besu-common
    command:
      - --profile=ENTERPRISE
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/data/key
      - --network-id=9127
      - --sync-mode=FULL
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/data/static-nodes.json
      - --nat-method=NONE
      - --sync-min-peers=1
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./node-data/node4:/data

  faucet:
    build: ./faucet
    restart: unless-stopped
    init: true
    depends_on:
      node1:
        condition: service_started
    networks: [quantum]
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "8787"
      LISTEN_HOST: "0.0.0.0"
      RPC_URL: http://node1:8545
      CHAIN_ID: "9127"
      FAUCET_DRIP_ZNYT: ${FAUCET_DRIP_ZNYT:-100}
      FAUCET_COOLDOWN_MS: ${FAUCET_COOLDOWN_MS:-60000}
      FAUCET_MAX_QUEUE: ${FAUCET_MAX_QUEUE:-32}
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:?FAUCET_PRIVATE_KEY is required in .env}
      FAUCET_ADDRESS: ${FAUCET_ADDRESS:?FAUCET_ADDRESS is required in .env}
    expose:
      - "8787"

  p2p-signal:
    build: ./p2p-signal
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    environment:
      PORT: "8788"
      LISTEN_HOST: "0.0.0.0"
      ZERONYTH_STUN_URLS: ${ZERONYTH_STUN_URLS:-}
    networks: [quantum]
    expose:
      - "8788"

  explorer:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      node1:
        condition: service_started
      faucet:
        condition: service_started
      p2p-signal:
        condition: service_started
    networks: [quantum]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/node.html:/usr/share/nginx/html/node.html:ro
      - ./dashboard/assets:/usr/share/nginx/html/assets:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

networks:
  quantum:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
