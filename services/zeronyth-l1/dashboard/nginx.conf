limit_req_zone $binary_remote_addr zone=qsl1_faucet:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=qsl1_p2p:1m rate=30r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /rpc {
    limit_except POST { deny all; }
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host node1;
    proxy_read_timeout 10s;
    proxy_pass http://node1:8545/;
  }

  location = /api/faucet/health {
    limit_except GET { deny all; }
    proxy_http_version 1.1;
    proxy_set_header Host faucet;
    proxy_read_timeout 5s;
    proxy_pass http://faucet:8787/health;
  }

  location = /api/faucet/claim {
    limit_except POST { deny all; }
    limit_req zone=qsl1_faucet burst=2 nodelay;
    client_max_body_size 8k;
    proxy_http_version 1.1;
    proxy_set_header Host faucet;
    proxy_read_timeout 15s;
    proxy_pass http://faucet:8787/claim;
  }

  # SDP/ICE signaling only; encrypted WebRTC data does NOT travel via this proxy.
  location /api/p2p/ {
    limit_except GET POST { deny all; }
    limit_req zone=qsl1_p2p burst=30 nodelay;
    client_max_body_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Host p2p-signal;
    proxy_read_timeout 10s;
    proxy_pass http://p2p-signal:8788/;
  }
}
