name: ZERONYTH Full E2E

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeronyth-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  full-e2e:
    name: 4-validator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_ANSI: never
      DOCKER_BUILDKIT: "1"
      RPC_WAIT_ATTEMPTS: "90"
      RPC_WAIT_SLEEP_SECONDS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"

      - name: Show runtime versions
        run: |
          set -euo pipefail
          docker version
          docker compose version
          python3 --version

      - name: Offline package tests
        run: |
          set -euo pipefail
          rm -f .env
          rm -f config/genesis.json config/static-nodes.json config/validators.json
          rm -rf networkFiles
          find node-data -type f ! -name '.gitkeep' -delete 2>/dev/null || true
          make validate
          make test
          docker compose --env-file .env.example config --quiet

      - name: Compile Solidity examples with pinned compiler
        run: ./scripts/compile-contracts.sh

      - name: Prepare local dev environment
        run: cp .env.example .env

      - name: Initialize validator identities and genesis
        run: ./scripts/init-network.sh

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for JSON-RPC
        run: ./scripts/wait-for-rpc.sh

      - name: Consensus smoke test
        run: ./scripts/smoke-test.sh

      - name: Explorer and faucet E2E
        run: ./scripts/e2e-test.sh

      - name: Remove temporary env before packaging
        run: rm -f .env

      - name: Build and verify resale package
        run: |
          set -euo pipefail
          ./scripts/package-release.sh
          python3 ./scripts/verify-release.py ./dist/zeronyth-l1-starter-kit-v$(cat VERSION).zip

      - name: Rebuild package and verify reproducibility
        run: |
          set -euo pipefail
          first="$(sha256sum ./dist/zeronyth-l1-starter-kit-v$(cat VERSION).zip | awk '{print $1}')"
          rm -rf ./dist-repro
          ./scripts/package-release.sh ./dist-repro
          second="$(sha256sum ./dist-repro/zeronyth-l1-starter-kit-v$(cat VERSION).zip | awk '{print $1}')"
          test "$first" = "$second"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps > ci-artifacts/compose.log 2>&1
          docker compose config --services > ci-artifacts/compose-services.txt 2>&1
          ./scripts/status.sh > ci-artifacts/rpc-status.txt 2>&1
          find dist -maxdepth 1 -type f -printf '%f\n' > ci-artifacts/release-files.txt 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: zeronyth-ci-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
