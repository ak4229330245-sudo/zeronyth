kind = "web"
previewPath = "/"
title = "ZERONYTH Local Testnet"
description = "Original ZERONYTH explorer connected to four local Besu QBFT validators. Development-only; no public chain or real-value token deployment."
version = "1.0.0"
id = "artifacts/zeronyth"
router = "path"

[[services]]
name = "web"
paths = ["/", "/rpc", "/api/faucet", "/api/p2p"]
localPort = 22673

[services.development]
run = "pnpm --filter @workspace/zeronyth run dev"

[services.env]
PORT = "22673"
BASE_PATH = "/"
