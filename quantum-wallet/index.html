<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZERONYTH Quantum Wallet</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0c1015">
<style>
  /* Site palette (zeronyth.dpdns.org assets/styles.css tokens) — Batch 4 unification. */
  :root { color-scheme: dark;
    --bg:#0c1015; --surface:#131920; --raised:#1a222b; --sunk:#0a0d11;
    --line:#27313c; --line-2:#364352;
    --text:#ece7db; --muted:#93a0ad; --dim:#66737f;
    --mint:#6fe3c4; --mint-ink:#06231c; --violet:#a98bff;
    --warn:#ff7b5c; --amber:#f0c36a; --ok:#6fe3c4;
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho","Songti SC","Noto Serif CJK SC","Noto Serif CJK KR","Apple SD Gothic Neo",Georgia,serif;
    --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI","Hiragino Sans","Yu Gothic UI","PingFang SC","Microsoft YaHei","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text);
         margin: 0 auto; max-width: 560px; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-family: var(--display); font-size: 20px; margin: 8px 0; }
  h2 { font-family: var(--display); }
  header .spacer { flex: 1; }
  section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
                  padding: 16px; margin: 14px 0; }
  section.banner { border-color: var(--amber); }
  input[type="text"], input[type="password"] { background: var(--sunk); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0 12px;
    max-width: 100%; box-sizing: border-box; }
  button { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 14px; cursor: pointer; margin: 2px; }
  button:hover { border-color: var(--line-2); }
  button.primary { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); font-weight: 600; }
  button.danger { background: var(--warn); border-color: var(--warn); color: #200b06; }
  button[disabled] { opacity: .55; cursor: default; }
  select { background: var(--raised); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.ecdsa { color: var(--muted); } .badge.falcon { color: var(--violet); }
  .badge.mldsa { color: var(--mint); }
  .qr { font-size: 11px; color: var(--ok); border: 1px solid var(--mint); border-radius: 999px; padding: 1px 6px; }
  .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .addr { font-family: var(--mono); font-size: 12.5px; word-break: break-all; margin: 6px 0; }
  .addr-big { font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--warn); } .ok { color: var(--ok); }
  .busy { color: var(--amber); }
  .tagline { color: var(--muted); }
  .warn-banner { background: rgba(240,195,106,.08); border: 1px solid var(--amber); border-radius: 8px;
                 padding: 8px 10px; font-size: 13px; }
  .acct { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .acct .bal { margin-left: auto; font-weight: 600; }
  .schemes { display: grid; gap: 8px; margin: 10px 0; }
  .scheme { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line);
            border-radius: 10px; padding: 10px; cursor: pointer; }
  .scheme.sel { border-color: var(--mint); }
  .scheme .note { color: var(--muted); font-size: 12.5px; flex: 1; }
  table.kv { border-collapse: collapse; width: 100%; margin: 8px 0; }
  table.kv th { text-align: left; color: var(--muted); font-weight: normal; padding: 4px 8px 4px 0; white-space: nowrap; }
  table.kv td { padding: 4px 0; }
  .reset-zone { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
  .reset-btn { width: 100%; background: none; border: 1px solid var(--amber); color: var(--amber); }
  .reset-panel { margin-top: 10px; border: 1px solid var(--amber); border-radius: 10px;
                 padding: 12px; background: rgba(240,195,106,.08); font-size: 13.5px; }
  label.check { display: block; margin: 6px 0; }
  a { color: var(--mint); }
  textarea { background: var(--sunk); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; margin: 6px 0 12px; width: 100%;
    max-width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 13px; }
  input[type="file"] { margin: 6px 0 12px; color: var(--muted); }
  .words { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .word { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-family: var(--mono); font-size: 13px; }
  .word i { color: var(--dim); font-style: normal; margin-right: 6px; font-size: 11px; }
</style>
<script type="importmap">
{
  "imports": {
    "@noble/": "./node_modules/@noble/"
  }
}
</script>
</head>
<body>
<header>
  <h1>🛡️ ZERONYTH Quantum Wallet</h1>
  <span class="spacer"></span>
  <span id="conn" class="muted">…</span>
  <select id="lang-sel" aria-label="Language">
    <option value="ja">日本語</option>
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
    <option value="ko">한국어</option>
  </select>
  <button id="lock-btn" hidden>Lock</button>
</header>
<main id="view"></main>
<script type="module" src="./main.mjs"></script>
<script>
// Boot guard: if the app has not rendered within 12 s, assume a poisoned
// service-worker cache (mixed files from an older build), heal it —
// unregister all service workers and clear Cache Storage — and reload
// once. localStorage is NEVER touched: the wallet vault lives there.
// If the app still does not boot, show a message instead of a blank page.
setTimeout(async () => {
  if (window.__qwBooted) return;
  try {
    if (!sessionStorage.getItem('qw-heal-tried')) {
      sessionStorage.setItem('qw-heal-tried', '1');
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
      location.reload();
      return;
    }
  } catch (e) { /* fall through to the message */ }
  if (!window.__qwBooted) {
    const v = document.getElementById('view');
    if (v) v.innerHTML = '<section class="panel"><h2>読み込みに失敗しました</h2><p class="muted">アプリを読み込めませんでした。通信環境を確認して、もう一度開き直してください。何度も失敗する場合は、このページではなく zeronyth.dpdns.org のトップから開き直してください。</p></section>';
  }
}, 12000);
</script>
</body>
</html>
